name: Verify reading editions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edition-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Edition structure and navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted edition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-checks.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-checks.txt

      # Validate the committed files before any rebuild could hide stale outputs.
      # This checks the delivered edition; it does not exercise the build pipeline.
      - name: Check manuscript, manifest, PDF, and EPUB
        run: python validate_edition.py
