<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1272" viewBox="0 0 1440 1272" role="img" aria-labelledby="title desc">
<title id="title">Let the attempt discover something</title>
<desc id="desc">Exact manuscript excerpts, before and after. Both depict a fictional illustration. Text and commentary are available in methods/WORKED_EXAMPLES.md.</desc>
<rect width="1440" height="1272" fill="#f7f4eb"/>
<rect x="0" y="0" width="12" height="1272" fill="#24685c"/>
<text x="60" y="57" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">CREATURES OF CONTEXT  /  EDITORIAL EXAMPLE 03</text>
<text x="60" y="130" fill="#223531" font-family="DejaVu Serif" font-size="48" font-weight="normal">Let the attempt discover something</text>
<text x="62" y="175" fill="#52605a" font-family="DejaVu Sans" font-size="24" font-weight="normal">Chapter 11 · Exact excerpts · Fictional illustration</text>
<rect x="738" y="208" width="670" height="868" fill="#e8eee4"/>
<text x="64" y="244" fill="#52605a" font-family="DejaVu Sans" font-size="22" font-weight="bold">BEFORE</text>
<text x="768" y="244" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">AFTER</text>
<text x="64" y="292" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">The draft says a rough paragraph could reveal</text>
<text x="64" y="327" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">a problem.</text>
<text x="768" y="292" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">The paragraph exposes an inference the writer</text>
<text x="768" y="326" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">cannot support.</text>
<text x="64" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">For the imagined report, a rough</text>
<text x="64" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">paragraph that states the argument</text>
<text x="64" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">may be more revealing than another</text>
<text x="64" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">hour of preparation. It creates</text>
<text x="64" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">something that can be evaluated. The</text>
<text x="64" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">first useful product might be a visible</text>
<text x="64" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">problem rather than a good sentence.</text>
<text x="768" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">Suppose the author finally writes the</text>
<text x="768" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">paragraph. It recommends continuing a</text>
<text x="768" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">project because participation has risen.</text>
<text x="768" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">On the page, the gap is suddenly</text>
<text x="768" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">obvious: more people attending does</text>
<text x="768" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">not establish that the project helped</text>
<text x="768" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">them. The information on hand was</text>
<text x="768" y="674" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">enough to begin, but not enough to</text>
<text x="768" y="716" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">support the conclusion.</text>
<text x="768" y="800" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">The author marks the missing evidence</text>
<text x="768" y="842" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">and sends a colleague a specific</text>
<text x="768" y="884" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">question about outcomes. The</text>
<text x="768" y="926" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">paragraph is still poor. It has done</text>
<text x="768" y="968" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">something the rearranged heading</text>
<text x="768" y="1010" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">could not: revealed what the report</text>
<text x="768" y="1052" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">needs next.</text>
<rect x="64" y="1088" width="1308" height="2" fill="#c7cec2"/>
<text x="64" y="1138" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">The example makes the missing evidence specific: attendance alone cannot establish benefit.</text>
<text x="64" y="1176" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">The imperfect draft changes the next action.</text>
<text x="64" y="1248" fill="#52605a" font-family="DejaVu Sans" font-size="20" font-weight="normal">Editorial intention, not a measured reader outcome.  Source: records/STYLE_CHANGES.json</text>
</svg>
