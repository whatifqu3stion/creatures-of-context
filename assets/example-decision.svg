<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="936" viewBox="0 0 1440 936" role="img" aria-labelledby="title desc">
<title id="title">Stay inside the decision</title>
<desc id="desc">Exact manuscript excerpts, before and after. Both depict a fictional illustration. Text and commentary are available in methods/WORKED_EXAMPLES.md.</desc>
<rect width="1440" height="936" fill="#f7f4eb"/>
<rect x="0" y="0" width="12" height="936" fill="#24685c"/>
<text x="60" y="57" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">CREATURES OF CONTEXT  /  EDITORIAL EXAMPLE 01</text>
<text x="60" y="130" fill="#223531" font-family="DejaVu Serif" font-size="48" font-weight="normal">Stay inside the decision</text>
<text x="62" y="175" fill="#52605a" font-family="DejaVu Sans" font-size="24" font-weight="normal">Chapter 1 · Exact excerpts · Fictional illustration</text>
<rect x="738" y="208" width="670" height="532" fill="#e8eee4"/>
<text x="64" y="244" fill="#52605a" font-family="DejaVu Sans" font-size="22" font-weight="bold">BEFORE</text>
<text x="768" y="244" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">AFTER</text>
<text x="64" y="292" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">Three new situations interrupt a decision</text>
<text x="64" y="327" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">already worth following.</text>
<text x="768" y="292" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">The visit supplies information the applicant</text>
<text x="768" y="326" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">can act on.</text>
<text x="64" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">We can now ask what would be</text>
<text x="64" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">different if an explanation were true. If</text>
<text x="64" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">interruption is the problem, a protected</text>
<text x="64" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">interval should help. If the task is</text>
<text x="64" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">unclear, removing distractions may</text>
<text x="64" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">simply provide a quieter place to</text>
<text x="64" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">remain confused. If another person&#x27;s</text>
<text x="64" y="674" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">answer is needed, further introspection</text>
<text x="64" y="716" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">may have reached its limit.</text>
<text x="768" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">The visit has done something that</text>
<text x="768" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">another evening of weighing feelings</text>
<text x="768" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">could not: it has supplied information</text>
<text x="768" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">about the job. The applicant can now</text>
<text x="768" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">ask about the evening duties instead of</text>
<text x="768" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">wondering whether they are simply</text>
<text x="768" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">afraid of change.</text>
<rect x="64" y="752" width="1308" height="2" fill="#c7cec2"/>
<text x="64" y="802" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">The revision connects an observation to the next question. It keeps the reader with the</text>
<text x="64" y="840" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">applicant long enough to see what changed.</text>
<text x="64" y="912" fill="#52605a" font-family="DejaVu Sans" font-size="20" font-weight="normal">Editorial intention, not a measured reader outcome.  Source: records/STYLE_CHANGES.json</text>
</svg>
