<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
<title id="title">Give recognition an event</title>
<desc id="desc">Exact manuscript excerpts, before and after. Both depict a fictional illustration. Text and commentary are available in methods/WORKED_EXAMPLES.md.</desc>
<rect width="1440" height="1230" fill="#f7f4eb"/>
<rect x="0" y="0" width="12" height="1230" fill="#24685c"/>
<text x="60" y="57" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">CREATURES OF CONTEXT  /  EDITORIAL EXAMPLE 02</text>
<text x="60" y="130" fill="#223531" font-family="DejaVu Serif" font-size="48" font-weight="normal">Give recognition an event</text>
<text x="62" y="175" fill="#52605a" font-family="DejaVu Sans" font-size="24" font-weight="normal">Chapter 9 · Exact excerpts · Fictional illustration</text>
<rect x="738" y="208" width="670" height="826" fill="#e8eee4"/>
<text x="64" y="244" fill="#52605a" font-family="DejaVu Sans" font-size="22" font-weight="bold">BEFORE</text>
<text x="768" y="244" fill="#24685c" font-family="DejaVu Sans" font-size="22" font-weight="bold">AFTER</text>
<text x="64" y="292" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">The paragraph names continuity, then explains</text>
<text x="64" y="327" fill="#52605a" font-family="DejaVu Sans" font-size="25" font-weight="normal">it again.</text>
<text x="768" y="292" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">A remembered book makes the next</text>
<text x="768" y="327" fill="#24685c" font-family="DejaVu Sans" font-size="25" font-weight="normal">conversation possible.</text>
<text x="64" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">In an imagined neighborhood reading</text>
<text x="64" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">group, a newcomer initially sits at the</text>
<text x="64" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">edge and listens. Over time, someone</text>
<text x="64" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">remembers what they said. Another</text>
<text x="64" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">person asks whether they will come</text>
<text x="64" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">next week. They begin choosing a</text>
<text x="64" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">passage, setting out chairs, or</text>
<text x="64" y="674" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">disagreeing about a book with people</text>
<text x="64" y="716" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">who know that disagreement will not</text>
<text x="64" y="758" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">end the acquaintance.</text>
<text x="64" y="842" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">Nothing spectacular has happened. The</text>
<text x="64" y="884" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">relationship has acquired continuity</text>
<text x="64" y="926" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">and a little mutual expectation.</text>
<text x="64" y="968" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">Participation no longer begins entirely</text>
<text x="64" y="1010" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">from zero.</text>
<text x="768" y="380" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">At the reading group, our newcomer</text>
<text x="768" y="422" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">initially sits at the edge and listens. On</text>
<text x="768" y="464" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">a later visit, someone remembers the</text>
<text x="768" y="506" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">book they mentioned and asks whether</text>
<text x="768" y="548" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">they finished it. The answer starts a</text>
<text x="768" y="590" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">conversation they could not have had</text>
<text x="768" y="632" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">on the first evening. They no longer</text>
<text x="768" y="674" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">have to introduce their whole life</text>
<text x="768" y="716" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">before saying something about it.</text>
<text x="768" y="800" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">In time they choose a passage for the</text>
<text x="768" y="842" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">group, help set out chairs, and disagree</text>
<text x="768" y="884" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">about a book. Someone asks whether</text>
<text x="768" y="926" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">they will be there next week. The</text>
<text x="768" y="968" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">question is ordinary. Being expected is</text>
<text x="768" y="1003" fill="#223531" font-family="DejaVu Serif" font-size="29" font-weight="normal">new.</text>
<rect x="64" y="1046" width="1308" height="2" fill="#c7cec2"/>
<text x="64" y="1096" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">Recognition now has a particular cause and consequence. The reader can follow what is</text>
<text x="64" y="1134" fill="#223531" font-family="DejaVu Sans" font-size="27" font-weight="normal">different about returning to the same group.</text>
<text x="64" y="1206" fill="#52605a" font-family="DejaVu Sans" font-size="20" font-weight="normal">Editorial intention, not a measured reader outcome.  Source: records/STYLE_CHANGES.json</text>
</svg>
